name: host-and-artifact-conformance

on:
  push:
  pull_request:

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest pyyaml openpyxl==3.1.5 python-docx==1.2.0
      - name: Validate JSON manifests
        shell: python
        run: |
          import json
          from pathlib import Path
          for path in (
              Path("plugin/hooks/hooks.json"),
              Path("plugin/hooks/hooks-codex.json"),
              Path("plugin/.claude-plugin/plugin.json"),
              Path("plugin/.codex-plugin/plugin.json"),
              Path(".claude-plugin/marketplace.json"),
              Path(".agents/plugins/marketplace.json"),
          ):
              json.loads(path.read_text(encoding="utf-8"))
      - name: Reconcile Windows shard coverage
        if: runner.os == 'Windows'
        shell: python
        run: |
          from collections import Counter
          from pathlib import Path
          import re
          import yaml
          steps = yaml.safe_load(Path('.github/workflows/conformance.yml').read_text())['jobs']['conformance']['steps']
          selected = [step for step in steps if step.get('if') == "runner.os == 'Windows'" and 'python -m pytest' in step.get('run', '')]
          counts = Counter(path for step in selected for path in re.findall(r'tests/test_[a-z0-9_]+\.py', step['run']))
          expected = {str(path).replace('\\', '/') for path in Path('tests').glob('test_*.py')}
          assert set(counts) == expected, {'missing': sorted(expected - set(counts)), 'unknown': sorted(set(counts) - expected)}
          assert all(count == 1 for count in counts.values()), counts
          print(f'{len(expected)} default modules, each in exactly one Windows shard')
      - name: Run Windows packed-artifact shard
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: python -m pytest -q tests/test_packaging.py
      - name: Run Windows no-persistence shard
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -m pytest -q tests/test_audit_disabled.py
      - name: Run Windows Claude adapter shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_adapter.py
      - name: Run Windows Codex adapter shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_codex_adapter.py
      - name: Run Windows presentation and host-contract shard
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: python -m pytest -q tests/test_approval_presentation.py tests/test_windows_native_approval.py tests/test_host_conformance.py tests/test_lifecycle_adapters.py tests/test_context_efficiency.py
      - name: Run Windows engine and shell shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_engine_rules.py tests/test_shellparse.py tests/test_windows_shell.py tests/test_classification_regressions.py tests/test_bypass_corpus.py
      - name: Run Windows store and policy shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_store_agw.py tests/test_policy_health.py tests/test_levels.py tests/test_archive_transactions.py tests/test_office.py tests/test_office_structured.py
      - name: Run Windows media, retention, and publication shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_media_review.py tests/test_retention.py tests/test_retention_policy.py tests/test_retention_policy_propagation.py tests/test_retention_integration.py tests/test_store_retention_audit.py tests/test_file_ops.py tests/test_staged_batch_publication.py tests/test_publication_recovery_core.py tests/test_publish_validation_integration.py
      - name: Run Windows launcher and command-contract shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_action_contracts.py tests/test_adapter_plumbing.py tests/test_agw_contract.py tests/test_cli_safety_contracts.py tests/test_clobber_coverage.py tests/test_codex_dispatch_failures.py tests/test_codex_launcher_rewrite.py tests/test_codex_wire_contract.py tests/test_hook_fast_path.py tests/test_inline_script_evidence.py tests/test_launcher_wrappers.py tests/test_powershell_ask_routing.py tests/test_powershell_corpus.py
      - name: Run Windows recovery and workflow shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_prepared_rollback_recovery.py tests/test_recovery_storage.py tests/test_recovery_transactions.py tests/test_retention_real_fixture.py tests/test_run_plans.py tests/test_safe_next.py tests/test_store_hook_budget.py tests/test_workflow_diagnostics.py tests/test_workflow_limits.py tests/test_workflow_output_roots.py tests/test_workflow_refresh.py tests/test_workflows.py tests/test_long_run_smoke.py
      - name: Run Windows platform and Office contract shard
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: python -m pytest -q tests/test_claude_linux_review.py tests/test_execution.py tests/test_gitargs.py tests/test_linux_review.py tests/test_linux_review_terminal.py tests/test_office_relationship_paths.py tests/test_office_validation.py tests/test_office_xlsm.py tests/test_office_xlsm_windows_integration.py tests/test_outcome_contracts.py tests/test_path_safety.py tests/test_policy_cache.py tests/test_policy_friction_corpus.py tests/test_profile_cache.py
      - name: Run source and packed-artifact conformance on Unix
        if: runner.os != 'Windows'
        run: python -m pytest -q

  stdlib-only:
    # PyYAML is optional (contract 5), and running without it is the documented
    # primary mode - but every matrix leg above installs it, so `miniyaml` was
    # the one policy reader CI never exercised. A corrupt pack that miniyaml
    # accepts loads as HEALTHY, which is a fail-open on contract 1.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Create a virtualenv with pytest and nothing else
        run: |
          python -m venv .venv-stdlib
          .venv-stdlib/bin/python -m pip install --upgrade pip
          .venv-stdlib/bin/python -m pip install pytest
      - name: Assert PyYAML really is absent
        run: |
          if .venv-stdlib/bin/python -c "import yaml" 2>/dev/null; then
            echo "PyYAML is installed; this leg proves nothing" >&2
            exit 1
          fi
      - name: Run policy and engine suites on the stdlib reader
        timeout-minutes: 5
        run: .venv-stdlib/bin/python -m pytest -q tests/test_policy_health.py tests/test_engine_rules.py
